# Sendline - self-hosted SMS + email marketing.
# Everything binds to 127.0.0.1. Nothing here is reachable from the open
# internet; remote access is Tailscale's job, not a forwarded port's.
services:
  sendline-db:
    container_name: sendline-db
    image: mongo:7
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
      - MONGO_INITDB_DATABASE=sendline
    volumes:
      - sendline_data:/data/db
    ports:
      # Loopback only. The API reaches Mongo over the compose network.
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    networks:
      - sendline-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  sendline-redis:
    container_name: sendline-redis
    image: redis:7-alpine
    restart: always
    volumes:
      - sendline_redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - sendline-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  sendline-api:
    container_name: sendline-api
    image: sendline-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      # 0.0.0.0 on purpose: the Android phone on your LAN and devices on your
      # tailnet both need to reach this. It is the one service that listens
      # beyond loopback, and it requires a JWT or an API key for every route.
      - "${PORT:-3001}:3001"
    env_file:
      - ./api/.env
    environment:
      - PORT=${PORT:-3001}
      - REDIS_URL=${REDIS_URL:-redis://sendline-redis:6379}
      - USE_SMS_QUEUE=${USE_SMS_QUEUE:-true}
    depends_on:
      sendline-db:
        condition: service_healthy
      sendline-redis:
        condition: service_healthy
    networks:
      - sendline-network

  sendline-web:
    container_name: sendline-web
    image: sendline-web
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked in at build time: this is the address the BROWSER calls, so it
        # must be your tailnet address, not a container name.
        - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - sendline-api
    networks:
      - sendline-network

# Deliberately absent: mongo-express. It shipped on :8081 with admin enabled
# and default credentials. Use `docker exec -it sendline-db mongosh` instead.

networks:
  sendline-network:
    driver: bridge

volumes:
  sendline_data:
  sendline_redis:
